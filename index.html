<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Body Mirror — рухайся, і персонаж повторить</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eef3ff;font:15px system-ui,Arial;overflow:hidden}
#app{height:100dvh;display:flex;flex-direction:column}
header{padding:12px 15px;display:flex;align-items:center;justify-content:space-between;background:#11182a;border-bottom:1px solid #27334d}
h1{font-size:17px;margin:0}#status{font-size:12px;color:#aab8d5}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.panel{position:relative;min-height:0;background:#111827;border:1px solid #283650;border-radius:14px;overflow:hidden}
.panel label{position:absolute;z-index:2;top:9px;left:10px;background:#101827cc;padding:5px 8px;border-radius:8px;font-size:12px}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
canvas{width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
footer{padding:10px 12px 14px;background:#11182a;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:11px;padding:11px 15px;font-weight:700;background:#6d8cff;color:#071023}
button.secondary{background:#26344f;color:#eef3ff}button:disabled{opacity:.5}
.hint{font-size:12px;color:#aab8d5;text-align:center;width:100%}
@media(max-width:650px){main{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.panel{min-height:0}header{padding:9px 12px}}
</style>
</head>
<body>
<div id="app">
<header><h1>🕺 BODY MIRROR</h1><div id="status">Камера ще не запущена</div></header>
<main>
 <section class="panel"><label>ТВОЇ РУХИ</label><video id="video" playsinline muted></video><canvas id="overlay"></canvas></section>
 <section class="panel"><label>ПЕРСОНАЖ ПОВТОРЮЄ</label><canvas id="game"></canvas></section>
</main>
<footer>
 <button id="start">Увімкнути камеру</button><button id="stop" class="secondary" disabled>Зупинити</button>
 <div class="hint">Дозволь доступ до камери та відійди так, щоб усе тіло було видно. Камера працює у твоєму браузері.</div>
</footer>
</div>
<script type="module">
import { FilesetResolver, PoseLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const video=document.querySelector('#video'), overlay=document.querySelector('#overlay'), ctx=overlay.getContext('2d');
const game=document.querySelector('#game'), statusEl=document.querySelector('#status');
const startBtn=document.querySelector('#start'), stopBtn=document.querySelector('#stop');
let stream=null, landmarker=null, running=false, lastVideoTime=-1, pose=null, renderer, scene, camera, rig={};

function makeAvatar(){
 scene=new THREE.Scene(); scene.background=new THREE.Color(0x101827);
 camera=new THREE.PerspectiveCamera(38,1,.1,100); camera.position.set(0,1.2,7.5); camera.lookAt(0,1.1,0);
 renderer=new THREE.WebGLRenderer({canvas:game,antialias:false}); renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 scene.add(new THREE.HemisphereLight(0xbfd8ff,0x25304a,2));
 const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(-3,5,5);scene.add(light);
 const mat=new THREE.MeshStandardMaterial({color:0x70a0ff,roughness:.75});
 const jointMat=new THREE.MeshStandardMaterial({color:0xe8efff,roughness:.7});
 const darkMat=new THREE.MeshStandardMaterial({color:0x263c68,roughness:.8});
 function ball(name,r,m){const o=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),m);scene.add(o);rig[name]=o;return o}
 function limb(name,r,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,8),m);scene.add(o);rig[name]=o;return o}
 ball('head',.17,jointMat);ball('chest',.25,mat);ball('hips',.20,darkMat);
 const names=['ls','rs','le','re','lw','rw','lh','rh','lk','rk','la','ra'];
 names.forEach(n=>ball(n,.085,jointMat));
 ['torso','upperL','upperR','foreL','foreR','thighL','thighR','shinL','shinR'].forEach(n=>limb(n,.075,mat));
 const floor=new THREE.Mesh(new THREE.CircleGeometry(2.2,32),new THREE.MeshBasicMaterial({color:0x1c2b45,transparent:true,opacity:.65}));
 floor.rotation.x=-Math.PI/2;floor.position.y=-.12;scene.add(floor);
 resize();animate();
}
function resize(){
 if(!renderer)return;const r=game.getBoundingClientRect();renderer.setSize(Math.max(1,r.width),Math.max(1,r.height),false);
 camera.aspect=Math.max(1,r.width)/Math.max(1,r.height);camera.updateProjectionMatrix();
 const v=video.getBoundingClientRect();overlay.width=Math.max(1,Math.round(v.width*devicePixelRatio));overlay.height=Math.max(1,Math.round(v.height*devicePixelRatio));
}
function setSegment(obj,a,b){
 const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=new THREE.Vector3().subVectors(B,A);
 obj.position.copy(A).add(B).multiplyScalar(.5);obj.scale.y=d.length();obj.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
}
function renderPose(lm){
 if(!lm||lm.length<33)return;
 const p=i=>[(.5-lm[i].x)*3.0,(.95-lm[i].y)*3.2,0];
 const names={head:0,chest:11,hips:23,ls:11,rs:12,le:13,re:14,lw:15,rw:16,lh:23,rh:24,lk:25,rk:26,la:27,ra:28};
 for(const [n,i] of Object.entries(names)){const q=p(i);rig[n].position.set(...q)}
 setSegment(rig.torso,p(11),p(23));setSegment(rig.upperL,p(11),p(13));setSegment(rig.upperR,p(12),p(14));
 setSegment(rig.foreL,p(13),p(15));setSegment(rig.foreR,p(14),p(16));setSegment(rig.thighL,p(23),p(25));setSegment(rig.thighR,p(24),p(26));setSegment(rig.shinL,p(25),p(27));setSegment(rig.shinR,p(26),p(28));
 // Keep the avatar facing forward while mirroring the user's horizontal movement.
}
function drawSkeleton(lm){
 const w=overlay.width,h=overlay.height;ctx.clearRect(0,0,w,h);if(!lm)return;
 const links=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[0,11],[0,12]];
 ctx.lineWidth=Math.max(3,w*.006);ctx.strokeStyle='#8cffc1';ctx.fillStyle='#fff';
 const xy=i=>[(1-lm[i].x)*w,lm[i].y*h];
 for(const [a,b] of links){if(lm[a].visibility<.35||lm[b].visibility<.35)continue;const A=xy(a),B=xy(b);ctx.beginPath();ctx.moveTo(...A);ctx.lineTo(...B);ctx.stroke()}
 for(const i of [0,11,12,13,14,15,16,23,24,25,26,27,28]){if(lm[i].visibility<.35)continue;const q=xy(i);ctx.beginPath();ctx.arc(q[0],q[1],Math.max(3,w*.008),0,Math.PI*2);ctx.fill()}
}
function animate(){
 requestAnimationFrame(animate);if(renderer)renderer.render(scene,camera);
 if(running&&video.readyState>=2&&video.currentTime!==lastVideoTime){
  lastVideoTime=video.currentTime;const result=landmarker.detectForVideo(video,performance.now());
  pose=result.landmarks?.[0]||null;drawSkeleton(pose);renderPose(pose);
 }
}
async function begin(){
 startBtn.disabled=true;statusEl.textContent='Завантаження моделі…';
 try{
  const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker=await PoseLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:'GPU'},runningMode:'VIDEO',numPoses:1,minPoseDetectionConfidence:.5,minTrackingConfidence:.5});
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
  video.srcObject=stream;await video.play();running=true;stopBtn.disabled=false;statusEl.textContent='Відстежую рухи';
  resize();
 }catch(e){statusEl.textContent='Не вдалося запустити камеру';alert('Не вдалося запустити: '+e.message+'\\nВідкрий сайт через HTTPS та дозволь камеру.');startBtn.disabled=false}
}
function stop(){running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;ctx.clearRect(0,0,overlay.width,overlay.height);statusEl.textContent='Камеру зупинено';stopBtn.disabled=true;startBtn.disabled=false}
startBtn.addEventListener('click',begin);stopBtn.addEventListener('click',stop);
window.addEventListener('resize',resize);makeAvatar();
</script>
</body></html>
