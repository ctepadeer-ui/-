if(prog>=1){pop();return}raf=(hold||prog>0)?requestAnimationFrame(tick):0}
function pop(){const s=S.stage;s.done=true;prog=0;hold=0;raf=0;$('#pg i').style.width='0';
document.querySelectorAll('#stage .bw').forEach(b=>{b.querySelector('.cap').style.transform='';b.classList.add('off2')});
const L='ABCDEFGHJKLMNPQRSTUVWXYZ';for(let i=0;i<s.n;i++)S.pend.push({code:pick(L)+'-'+(1000+Math.random()*9000|0)+'-'+pick(L)+pick(L),t:s.t,rew:roll(s.t)});
S.opened+=s.n;beep(900,.2,'sawtooth',.05,-600);beep(120,.25,'sine',.15,-60);const r=$('#stage').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.4,40+s.n*6,[TB[s.t].c,'#fff'],9);save();tix();setTimeout(()=>{S.stage=null;stage();head()},1000)}
const sg=$('#stage');sg.addEventListener('pointerdown',e=>{if(!S.stage||S.stage.done)return;hold=1;if(!raf){lt=performance.now();raf=requestAnimationFrame(tick)}});
['pointerup','pointerleave','pointercancel'].forEach(n=>sg.addEventListener(n,()=>hold=0));
function buy(t){if(S.trip)return toast('Ти в дорозі 🚐');if(S.stage)return toast('Спочатку відкрий куплене');const n=NM[S.up.multi],c=TB[t].p*n;if(S.money<c)return toast('Не вистачає грошей');S.money-=c;S.stage={t,n};beep(500,.08,'triangle',.06);beep(750,.1,'triangle',.06);stage();head();save()}
const nz=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,'');
function tryCode(){const v=nz($('#code').value);if(!v)return;const t=S.pend.find(p=>nz(p.code)===v);if(!t)return false;S.pend.splice(S.pend.indexOf(t),1);$('#code').value='';redeem(t);tix();return true}
$('#code').addEventListener('input',()=>{tryCode()});
function bad(){const c=$('#code');c.classList.remove('bad');void c.offsetWidth;c.classList.add('bad');beep(110,.25,'sawtooth',.06)}
$('#go').onclick=()=>{if(!tryCode())bad()};$('#code').addEventListener('keydown',e=>{if(e.key==='Enter'&&!tryCode())bad()});
function redeem(t,quiet){const r=t.rew,c=cm();let o;
if(r.k==='cash'){const g=r.v*c;S.money+=g;o={e:'💵',n:'Грошовий код',r:0,l:'+$'+fmt(g),m:-1}}
else if(r.k==='t'){S.bag.push({id:r.id,m:r.m,v:r.v});o={it:IT.t[r.id],r:r.r,m:r.m,l:'На продаж ≈ $'+fmt(r.v*c)}}
else{const key='c'+r.id,cur=S.col[key];if(cur===undefined||mulOf(r.m)>mulOf(cur)){S.col[key]=r.m;o={it:IT.c[r.id],r:r.r,m:r.m,l:cur===undefined?'У колекцію! ⭐+'+fmt(CSC[r.r]*mulOf(r.m)):'Покращено у колекції!'}}
else{const g=CSC[r.r]*4*TB[t.t].m*c;S.money+=g;o={it:IT.c[r.id],r:r.r,m:r.m,l:'Дублікат → +$'+fmt(g)}}}
head();save();if(quiet){toast('Авто: '+(o.it?o.it.n:'Грошовий код')+' · '+o.l);return}reveal(o)}
let rt;function reveal(o){const e=$('#rev'),col=RAR[o.r].color||RAR[o.r][1],nm=o.it?o.it.n:o.n;e.style.setProperty('--c',col);
e.innerHTML=(o.it?ico(o.it,o.m):`<span class="ico">${o.e}</span>`)+`<h2>${nm}</h2><div style="color:var(--mu);font-size:13px;margin-top:2px">${o.it?RAR[o.r][0]:'Готівка'}${o.m>=0?' · '+MUT[o.m][0]+' ×'+MUT[o.m][1]:''}</div><p>${o.l}</p>`;
e.classList.add('on');clearTimeout(rt);rt=setTimeout(()=>e.classList.remove('on'),o.r>=4?3000:1700);
for(let i=0;i<=o.r;i++)setTimeout(()=>beep(440+i*130,.28,'triangle',.07),i*85);
if(o.r>=3)burst(innerWidth/2,innerHeight*.42,30+o.r*30,[col,'#fff','#ffd23f'],12);
if(o.r>=4){const f=$('#fl');f.className='';f.style.background=col;void f.offsetWidth;f.className='on';document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');beep(1200,.6,'sine',.08,-900)}
if(o.r===5){const f=$('#fl');f.className='';f.style.background='';void f.offsetWidth;f.className='rb';beep(70,.9,'sawtooth',.12,-30)}}
$('#rev').onclick=()=>$('#rev').classList.remove('on');
/* particles */
const fx=$('#fx'),fc=fx.getContext('2d');let P=[],pr=0;function fsz(){fx.width=innerWidth;fx.height=innerHeight}fsz();addEventListener('resize',fsz);
function burst(x,y,n,cols,pw){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*pw;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-pw*.4,l:50+Math.random()*30,c:pick(cols),s:3+Math.random()*5})}if(!pr)pr=requestAnimationFrame(pl)}
function pl(){fc.clearRect(0,0,fx.width,fx.height);for(const p of P){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.l--;fc.globalAlpha=Math.min(1,p.l/20);fc.fillStyle=p.c;fc.fillRect(p.x,p.y,p.s,p.s)}P=P.filter(p=>p.l>0);pr=P.length?requestAnimationFrame(pl):0}
/* tabs */
const UP={multi:{n:'Мульти-пляшка',d:l=>`Відкривати ${NM[l+1]} пляшок одразу`,c:l=>[150,2500,40000][l],max:3},cash:{n:'Множник кешу',d:l=>`+20% до продажів і кеш-кодів (зараз ×${(1+.2*l).toFixed(1)}). Не діє на колекцію`,c:l=>Math.round(50*Math.pow(1.8,l)),max:15},luck:{n:'Удача мутацій',d:l=>`Шанс мутації ${15+2*l}% → ${17+2*l}%`,c:l=>Math.round(100*Math.pow(2,l)),max:10},auto:{n:'Авто-відкривач',d:l=>l?`Інтервал ${((10000-l*1800)/1000).toFixed(1)}с → швидше`:'Сам купує й списує дешеві пляшки',c:l=>300*Math.pow(3,l),max:5},type:{n:'Авто-впис коду',d:l=>l===0?`Сам вписує код: 1 символ за ${TI[0]/1000}с`:l<6?`1 символ за ${TI[l-1]/1000}с → ${TI[l]/1000}с`:`1 символ за ${TI[5]/1000}с`,c:l=>[200,600,2000,7000,25000,90000][l],max:6}};
const TI=[2000,1500,1000,800,500,200];
let tab='shop';
function pane(){const p=$('#pane');$('#p-shop').classList.toggle('off',tab!=='shop');p.classList.toggle('off',tab==='shop');if(tab==='shop')return;
if(tab==='bag'){const L=S.bag.map((b,i)=>({...b,i})).sort((a,b)=>b.v-a.v),tot=S.bag.reduce((a,b)=>a+b.v,0)*cm();
p.innerHTML=`<button class="wide" data-sellall ${S.bag.length?'':'disabled'}>Продати все · $${fmt(tot)}</button>`+(L.slice(0,80).map(b=>{const it=IT.t[b.id];return`<div class="row" style="--c:${RAR[it.r][1]}">${ico(it,b.m)}<div>${it.n}<small>${RAR[it.r][0]}${b.m>=0?' · '+MUT[b.m][0]:''}</small></div><button data-sell="${b.i}">$${fmt(b.v*cm())}</button></div>`}).join('')||'<p style="color:var(--mu)">Порожньо. Відкривай пляшки!</p>')+(L.length>80?`<p style="color:var(--mu)">…і ще ${L.length-80}</p>`:'')}
if(tab==='col'){const n=Object.keys(S.col).length;p.innerHTML=`<h3>Знайдено ${n}/200 · Рейтинг ⭐ ${fmt(score())}</h3><div class="grid">`+IT.c.map((it,i)=>{const m=S.col['c'+i];return m===undefined?`<div class="cell no" style="--c:${RAR[it.r][1]}44">?</div>`:`<div class="cell" style="--c:${RAR[it.r][1]}" title="${it.n}">${ico(it,m)}</div>`}).join('')+'</div>'}
if(tab==='road')road();
if(tab==='up')p.innerHTML=Object.entries(UP).map(([k,u])=>{const l=S.up[k],mx=l>=u.max,c=mx?0:u.c(l);return`<div class="row" style="--c:var(--ac)"><div>${u.n} <small>рівень ${l}/${u.max}</small><small>${mx?'Максимум':u.d(l)}</small></div><button data-up="${k}" ${mx||S.money<c?'disabled':''}>${mx?'MAX':'$'+fmt(c)}</button></div>`}).join('')}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
if(d.buy!==undefined)buy(+d.buy);
if(d.tab){tab=d.tab;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b===t));pane()}
if(d.sell!==undefined){const b=S.bag.splice(+d.sell,1)[0];if(b){S.money+=b.v*cm();beep(880,.1,'triangle',.06);head();save();pane()}}
if(d.sellall!==undefined&&S.bag.length){const g=S.bag.reduce((a,b)=>a+b.v,0)*cm();S.bag=[];S.money+=g;burst(innerWidth/2,innerHeight/2,40,['#ffd23f','#7cfc00'],9);beep(660,.3,'triangle',.07,300);toast('Продано! +$'+fmt(g));head();save();pane()}
if(d.go!==undefined)go(+d.go);
if(d.rs){rsub=d.rs;pane()}
if(d.vbuy!==undefined)vbuy();
if(d.vcol!==undefined)vcol();
if(d.hire!==undefined)hire();
if(d.rcol!==undefined)rcol();
if(d.pick){const[a,b]=d.pick.split(':');S.craft.sel[+a]=+b;save();pane()}
if(d.brew!==undefined)brew();
if(d.ccol!==undefined)ccol();
if(d.offer!==undefined)offer(+d.offer);
if(d.up){const u=UP[d.up],l=S.up[d.up],c=u.c(l);if(l<u.max&&S.money>=c){S.money-=c;S.up[d.up]++;beep(500,.1,'square',.05,500);if(d.up==='multi'){shelf()}if(d.up==='auto')autoLoop();if(d.up==='type')typeLoop();head();save();pane()}}});
function autoLoop(){clearTimeout(autoLoop.t);if(!S.up.auto)return;autoLoop.t=setTimeout(()=>{if(!$('#game').classList.contains('off')){const t=S.up.auto>=3?1:0;if(S.money>=TB[t].p){S.money-=TB[t].p;S.opened++;redeem({t,rew:roll(t)},true);if(tab==='bag')pane()}}autoLoop()},Math.max(2500,10000-S.up.auto*1800))}
function typeLoop(){clearTimeout(typeLoop.t);const l=S.up.type;if(!l)return;typeLoop.t=setTimeout(()=>{
if(!$('#game').classList.contains('off')&&S.pend.length){const inp=$('#code'),cur=inp.value.toUpperCase();
const t=cur?S.pend.find(p=>p.code.startsWith(cur)):S.pend[0];
if(!t)inp.value='';
else if(cur.length<t.code.length){inp.value=t.code.slice(0,cur.length+1);beep(700+cur.length*40,.03,'square',.02);if(inp.value.length===t.code.length)tryCode()}}
typeLoop()},TI[l-1])}
/* flow */
function startGame(){applyCity();arrive();$('#menu').classList.add('off');cancelAnimationFrame(mraf);$('#game').classList.remove('off');tab='shop';document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('on',!i));shelf();stage();tix();head();pane();autoLoop();typeLoop();if(!roadTick.i)roadTick.i=setInterval(roadTick,1000)}
$('#slots').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.slot){load(+d.slot);hold=0;prog=0;$('#code').value='';beep(400,.1,'square',.05,400);startGame()}
if(d.del&&confirm('Видалити слот '+d.del+' разом з прогресом?')){try{localStorage.removeItem(SK(+d.del))}catch(err){}slots()}});
$('#back').onclick=()=>{save();$('#game').classList.add('off');$('#menu').classList.remove('off');menuOn()};
$('#ttl').innerHTML=[...'КРИШКА'].map((c,i)=>`<span style="animation-delay:${i*.1}s">${c}</span>`).join('');
try{const o=localStorage.getItem('kr1');if(o){if(!localStorage.getItem(SK(1)))localStorage.setItem(SK(1),o);localStorage.removeItem('kr1')}}catch(e){}
S=def();SP=PAL.map(sprite);menuOn();
</script></body></html>
